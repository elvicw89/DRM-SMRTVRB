name: Windows VST3 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64 -DDRMSMRTVRB_BUILD_TESTS=ON -DDRMSMRTVRB_BUILD_PLUGIN=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: CPU benchmark (informational)
        run: build/Release/drmsmrtvrb_benchmark.exe 48000 512 10
      - name: Plugin processor CPU benchmark (informational)
        run: build/drmsmrtvrb_plugin_benchmark_artefacts/Release/drmsmrtvrb_plugin_benchmark.exe 48000 512 10
      - name: Stage VST3 bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -LiteralPath build/DRMSMRTVRB_artefacts/Release/VST3/DRM-SMRTVRB.vst3 -Destination artifact/DRM-SMRTVRB.vst3 -Recurse -Force
      - name: Archive Windows VST3
        uses: actions/upload-artifact@v7
        with:
          name: DRM-SMRTVRB-Windows-VST3
          path: artifact/
          if-no-files-found: error
          retention-days: 14
